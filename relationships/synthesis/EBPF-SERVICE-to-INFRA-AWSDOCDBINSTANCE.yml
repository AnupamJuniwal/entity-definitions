relationships:
  - name: ebpfServiceCallsInfraAwsDocDbInstance
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: protocol.name
        anyOf: [ "mongo" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
      - attribute: server.address
        regex: '^[a-zA-Z0-9.-]+\.docdb\.amazonaws\.com$'
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSDOCDBINSTANCE
          fields:
            - field: endpoint
              attribute: server.address
            - field: port
              attribute: remote_port
