relationships:
  # May also attempt to build a REDISINSTANCE GUID for AWS ElastiCache / Azure Redis
  # hosts (claimed by their own cloud-specific rules); harmless, since that GUID won't
  # resolve unless a real REDISINSTANCE entity was independently synthesized there.
  - name: ebpfServiceCallsInfraRedisInstance
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: protocol.name
        anyOf: [ "redis" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: REDISINSTANCE
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: remote.host.name
              - value: ":"
              - attribute: remote_port
            hashAlgorithm: FARM_HASH
