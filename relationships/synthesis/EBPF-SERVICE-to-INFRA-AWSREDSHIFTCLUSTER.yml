relationships:
  - name: ebpfServiceCallsInfraRedshiftCluster
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: protocol.name
        anyOf: [ "postgres" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
      - attribute: remote.host.name
        regex: '^[a-zA-Z0-9\-]+\.[a-z0-9]+\.[a-zA-Z0-9\-]+\.redshift\.amazonaws\.com$'
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSREDSHIFTCLUSTER
          fields:
            - field: serverAddress
              attribute: remote.host.name
