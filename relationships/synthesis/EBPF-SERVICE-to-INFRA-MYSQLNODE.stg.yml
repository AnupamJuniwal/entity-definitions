relationships:
  # STAGING ONLY. Mirrors APM-APPLICATION-to-INFRA-MYSQLNODE.stg.yml but sourced from
  # the eBPF agent's client-side span instead of a native APM datastore span.
  - name: ebpfServiceCallsInfraMysqlNodeStaging
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: protocol.name
        anyOf: [ "mysql" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: MYSQLNODE
          fields:
            - field: serverAddress
              attribute: remote.host.name
            - field: serverPort
              attribute: remote_port
