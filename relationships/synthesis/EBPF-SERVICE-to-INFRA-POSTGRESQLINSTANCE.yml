relationships:
  # Postgres wire protocol is also spoken by Redshift; Redshift traffic is claimed by
  # EBPF-SERVICE-to-INFRA-AWSREDSHIFTCLUSTER.yml via its own hostname-specific rule. This
  # rule may also attempt to build a POSTGRESQLINSTANCE GUID for Redshift hosts, but that
  # GUID won't resolve to any real entity unless one was independently synthesized there.
  - name: ebpfServiceCallsInfraPostgresqlInstance
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: protocol.name
        anyOf: [ "postgres" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: POSTGRESQLINSTANCE
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: remote.host.name
              - value: ":"
              - attribute: remote_port
            hashAlgorithm: FARM_HASH
