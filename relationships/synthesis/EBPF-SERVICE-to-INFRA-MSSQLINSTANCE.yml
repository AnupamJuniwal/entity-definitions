relationships:
  # mssql-metrics.pxl drops remote.host.name (only remote_addr, an IP), so this rule
  # keys off the span path instead, mirroring APM-APPLICATION-to-INFRA-MSSQLINSTANCE.stg.yml.
  - name: ebpfServiceCallsInfraMssqlInstance
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: trace_role
        anyOf: [ "client" ]
      - attribute: db.system
        anyOf: [ "mssql" ]
      - attribute: instrumentation.provider
        anyOf: [ "nr_ebpf" ]
      - attribute: k8s.cluster.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: MSSQLINSTANCE
          fields:
            - field: serverAddress
              attribute: remote.host.name
            - field: serverPort
              attribute: remote_port
